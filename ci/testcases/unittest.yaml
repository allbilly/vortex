# Unit tests (host). Native catalog entries — replaces the legacy
# regression.sh --unittest delegation (sw + hw unit tests).
category: unittest
defaults:
  xlen: [32, 64]
  tier: smoke
tests:
  - id: sw
    via: script
    run: "make -C tests/unittest run"
  - id: hw
    via: script
    run: "make -C hw/unittest"
  # FPU arithmetic units (VX_fma/fdiv/fsqrt/fcvt/fdivsqrt): the `hw` lane above only
  # builds the unit tests; this lane executes them so a softfloat-divergent
  # regression actually fails CI (each driver checks bit-exact result+fflags over
  # millions of vectors across all RISC-V rounding modes, default + lean configs).
  - id: hw-fpu
    via: script
    run: "make -C hw/unittest run-fpu"
  # TCU FEDP datapath: the `hw` lane only builds it; this lane executes tcu_fedp
  # per format (native TFR + DPI). touches gates it on tcu changes.
  - id: hw-tcu
    via: script
    run: "make -C hw/unittest run-tcu"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp]
  # Same native-TFR formats with the multipliers mapped onto DSP48 (USE_DSP=1) —
  # the FPGA-synthesis path, off by default in sim. Bit-identical to LUT by
  # contract, so a mismatch is a DSP-packing bug.
  - id: hw-tcu-dsp
    via: script
    run: "make -C hw/unittest run-tcu-dsp"
    touches: [hw/rtl/tcu, hw/unittest/tcu_fedp]
  - id: hw-dxa-setup
    via: script
    run: "make -j1 -C hw/unittest/dxa_setup run"
    touches: [hw/rtl/dxa/VX_dxa_setup.sv, hw/rtl/libs/VX_multiplier.sv, hw/unittest/dxa_setup]
  - id: hw-multiplier
    via: script
    run: "make -j1 -C hw/unittest/multiplier run-matrix"
    touches: [hw/rtl/libs/VX_multiplier.sv, hw/rtl/core/VX_alu_muldiv.sv, hw/unittest/multiplier]
  - id: hw-tcu-mx-index
    via: script
    run: "make -j1 -C hw/unittest/tcu_mx_index run"
    touches: [hw/rtl/tcu/VX_tcu_pkg.sv, hw/rtl/tcu/VX_tcu_core.sv, hw/unittest/tcu_mx_index]
  - id: hw-tcu-f4-mul
    via: script
    run: "make -j1 -C hw/unittest/tcu_f4_mul run-matrix"
    touches: [hw/rtl/tcu/tfr/VX_tcu_tfr_mul_f4.sv, hw/rtl/tcu/tfr/VX_tcu_tfr_wmul.sv, hw/unittest/tcu_f4_mul]
  - id: hw-tcu-masked-max-exp
    via: script
    run: "make -j1 -C hw/unittest/tcu_masked_max_exp run-matrix"
    touches: [hw/rtl/tcu/tfr/VX_tcu_tfr_masked_max_exp.sv, hw/rtl/tcu/tfr/VX_tcu_tfr_shared_mul.sv, hw/unittest/tcu_masked_max_exp]
  - id: hw-amo-reservation
    via: script
    run: "make -j1 -C hw/unittest/amo_reservation run"
    touches: [hw/rtl/cache/VX_amo_unit.sv, hw/rtl/mem/VX_local_mem.sv, sim/simx/amo/reservation_set.h, sim/simx/amo/amo_unit.cpp, sim/simx/amo/amo_unit.h, sim/simx/mem/cache.cpp, hw/unittest/amo_reservation]
  - id: hw-lmem-switch-split
    via: script
    run: "make -j1 -C hw/unittest/lmem_switch run"
    touches: [hw/rtl/mem/VX_lmem_switch.sv, sim/simx/mem/local_mem_switch.cpp, hw/unittest/lmem_switch]
  - id: hw-scoreboard-progress
    via: script
    run: "make -j1 -C hw/unittest/scoreboard_progress run"
    touches: [hw/rtl/core/VX_scoreboard.sv, hw/unittest/scoreboard_progress]
  - id: hw-lrsc-lifetime
    via: script
    run: "make -j1 -C hw/unittest/lrsc run-matrix"
    touches: [hw/rtl/core/VX_lsu_lrsc.sv, hw/rtl/core/VX_lsu_slice.sv, sim/simx/amo/lrsc_tracker.h, hw/unittest/lrsc]
  # Texel blend (VX_tex_lerp, both forms the sampler uses) against the C model
  # the SW sampler and SimX share, and the exact Vulkan f/256 blend, over every
  # input.
  - id: hw-tex-lerp
    via: script
    run: "make -C hw/unittest/tex_lerp run"
    touches: [hw/rtl/tex, hw/unittest/tex_lerp, sw/common/vx_gfx_abi.h, sw/common/gfx_frag_tex.h]
